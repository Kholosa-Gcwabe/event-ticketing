<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your tickets - For Public Use</title>
<meta name="theme-color" content="#111d5c">
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--text:#0f172a;--mute:#64748b;--acc:#0e7490}
@media (prefers-color-scheme:dark){:root{--bg:#020617;--card:#0f172a;--line:#1e293b;--text:#f1f5f9;--mute:#94a3b8;--acc:#22d3ee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:420px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.brand{font-size:11px;letter-spacing:.15em;color:var(--acc);font-weight:700}
.mute{color:var(--mute)}.hide{display:none!important}
button{cursor:pointer;border:0;font:inherit}
.btn{background:#0891b2;color:#fff;font-weight:700;border-radius:12px;padding:12px 14px;flex:1}
.btn2{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;border-radius:12px;padding:12px 14px;flex:1}
.tk{background:linear-gradient(135deg,#0f172a,#164e63);color:#fff;border:2px solid #22d3ee55;border-radius:24px;padding:22px}
.tk .l{color:#94a3b8;font-size:11px}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-block}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:#0891b2;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
 <div class="brand">FOR PUBLIC USE</div>
 <div id="main"><div class="card" style="text-align:center;margin-top:12px"><div class="spin"></div>Loading...</div></div>
</div>
<script>
const CFG=window.FPU_CONFIG||{};
const SUPABASE_URL=CFG.SUPABASE_URL||'https://nchnjiwntronxgwrvjuz.supabase.co';
const SUPABASE_KEY=CFG.SUPABASE_KEY||'PASTE_YOUR_PUBLISHABLE_KEY_HERE';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const token=(new URLSearchParams(location.search).get('o')||'').trim();
const sb=SUPABASE_KEY.startsWith('PASTE')?null:supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
let tries=0,timer=null,rendered='';
const when=v=>v?new Date(v).toLocaleString('en-ZA',{weekday:'short',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const box=h=>$('main').innerHTML='<div class="card" style="margin-top:12px">'+h+'</div>';

async function poll(){
 if(!sb)return box('<b>Not set up yet</b><p class="mute">The site owner still needs to add the publishable key in config.js.</p>');
 if(!token)return box('<b>Link not complete</b><p class="mute">Please open the link from your payment confirmation.</p>');
 const {data,error}=await sb.rpc('order_view',{p_token:token});
 if(error||!data){tries++;if(tries>3)box('<b>Could not load</b><p class="mute">Please check your connection and refresh this page. Your link stays valid.</p>');return}
 const s=data.status;
 if(s==='not_found'){clearInterval(timer);return box('<b>Order not found</b><p class="mute">Please check the link you were given.</p>')}
 if(s==='paid'){clearInterval(timer);return show(data)}
 if(s==='failed'||s==='expired'){clearInterval(timer);
  return box('<b>'+(s==='expired'?'This order timed out':'Payment not completed')+'</b><p class="mute">You have not been charged for this order. If money did leave your account, contact the organiser'+(data.support_contact?' on '+esc(data.support_contact):'')+' and quote this page address.</p>')}
 // pending: the payment confirmation can take a few seconds
 tries++;
 if(tries>40){clearInterval(timer);return box('<b>Still waiting for confirmation</b><p class="mute">Your payment may still be processing. Refresh this page in a minute. If it still does not show, contact the organiser'+(data.support_contact?' on '+esc(data.support_contact):'')+'. Keep this link.</p><button class="btn" style="width:100%" onclick="location.reload()">Refresh</button>')}
 box('<div style="text-align:center"><div class="spin"></div><b>Confirming your payment...</b><p class="mute" style="margin:4px 0 0">This usually takes a few seconds. Please keep this page open.</p></div>');
}
function show(d){
 const key=JSON.stringify(d.tickets.map(t=>[t.id,t.used,t.void]));if(key===rendered)return;rendered=key;
 const n=d.tickets.length;
 $('main').innerHTML=`<div class="card" style="margin-top:12px"><b style="font-size:18px">You are in, ${esc((d.buyer_name||'').split(' ')[0])}!</b>
  <p class="mute" style="margin:4px 0 0">${n} ticket${n===1?'':'s'} for ${esc(d.event)}. Show the QR code at the entrance. <b>Save or screenshot these tickets</b> and keep this link.</p></div>`+
  d.tickets.map((t,i)=>`<div class="card" style="padding:12px"><div class="tk" id="tk-${i}">
   <div style="font-size:11px;letter-spacing:.15em;color:#67e8f9">FOR PUBLIC USE</div>
   <div style="font-size:20px;font-weight:800">${esc(d.event)}</div>
   <div style="color:#cbd5e1;font-size:13px;margin-bottom:12px">${esc([when(d.event_date),d.venue].filter(Boolean).join(' · '))}</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
    <div><div class="l">Name</div><b>${esc(t.name)}</b></div><div><div class="l">Type</div><b>${esc(t.category)}</b></div>
    <div><div class="l">Code</div><b style="font-family:monospace;color:#67e8f9">${esc(t.code)}</b></div><div><div class="l">Payment</div><b>Paid online</b></div></div>
   <div style="display:flex;justify-content:center;margin:16px 0 6px"><div id="qr-${i}" style="background:#fff;padding:12px;border-radius:12px"></div></div>
   <div style="text-align:center;font-size:11px;color:#94a3b8">${t.void?'THIS TICKET HAS BEEN CANCELLED':t.used?'Already used at the gate':'Show this QR code at the entrance'}</div></div>
   <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="save(${i},'${esc(t.code)}')">Save image</button></div></div>`).join('')+
  `<div class="card"><button class="btn2" style="width:100%" onclick="shareLink()">Send this page via WhatsApp</button>
   <p class="mute" style="font-size:12px;margin:10px 0 0">Anyone with this page address can see these tickets, so share it only with people you trust.${d.support_contact?' Need help? '+esc(d.support_contact):''}</p></div>`;
 d.tickets.forEach((t,i)=>{try{new QRCode($('qr-'+i),{text:t.id,width:160,height:160,colorDark:'#020617',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H})}catch(e){}});
}
async function save(i,code){
 try{const c=await html2canvas($('tk-'+i),{backgroundColor:null,scale:2});
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='ticket-'+code+'.png';a.click()}
 catch(e){alert('Could not save the image. Please take a screenshot instead.')}
}
function shareLink(){open('https://wa.me/?text='+encodeURIComponent('My tickets: '+location.href),'_blank')}
poll();timer=setInterval(poll,3000);
</script>
</body>
</html>
